substitutions:
  _PROJECT_ID: mi-proyecto-gcp
  _REGION: us-central1
  _REPOSITORY: agentes
  _SERVICE: agente-polizas
  _SERVICE_ACCOUNT: sa-agente-polizas
  _MODEL: gemini-2.5-flash
  _FIRESTORE_COLLECTION: polizas

steps:
  - id: tests
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q ".[dev]" && ruff check . && pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${_PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}
      - --service-account=${_SERVICE_ACCOUNT}@${_PROJECT_ID}.iam.gserviceaccount.com
      - --no-allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=5
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=${_PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=TRUE,MODEL=${_MODEL},FIRESTORE_COLLECTION=${_FIRESTORE_COLLECTION},REPOSITORY_BACKEND=firestore,LOG_LEVEL=INFO

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
